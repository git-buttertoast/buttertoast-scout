<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3;url=https://experiments.buttertoast.co/scout">
<title>Scout has moved to Kitchen</title>
<script>
/* Scout now lives in Kitchen (22 Oct 2026). Old links keep working: this page reads the old
   address (query and #hash) and opens the matching Kitchen page. */
(function () {
  var K = 'https://experiments.buttertoast.co';
  function route(q, h) {
    var map = {
      dashboard: '/scout', pipeline: '/scout', candidates: '/scout', templates: '/scout',
      directory: '/scout?closed=1', roles: '/scout/roles',
      'jd-library': '/scout/library?tab=jd', assignments: '/scout/library?tab=assignments',
      onboarding: '/scout/onboarding'
    };
    return Object.prototype.hasOwnProperty.call(map, h) ? map[h] : '/scout';
  }
  var to = K + '/scout';
  try { to = K + route(new URLSearchParams(location.search), (location.hash || '').replace(/^#/, '')); } catch (e) {}
  window.__to = to;
  location.replace(to);
})();
</script>
<style>
  :root { --bg: #f7f4ef; --card: #ffffff; --ink: #1f1b16; --muted: #6b645b; --line: #e7e1d8; --tomato: #D84330; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141210; --card: #1e1b18; --ink: #f3eee8; --muted: #a59d93; --line: #2f2a25; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
  .mark { display: inline-flex; width: 40px; height: 40px; border-radius: 10px; background: var(--tomato); color: #fff; font-weight: 700; align-items: center; justify-content: center; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--muted); }
  a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 10px; background: var(--tomato); color: #fff; text-decoration: none; font-weight: 600; }
  a.btn:focus-visible { outline: 3px solid var(--tomato); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">BT</div>
  <h1>Scout now lives in Kitchen</h1>
  <p>Taking you there now. If nothing happens, use the button.</p>
  <a class="btn" id="go" href="https://experiments.buttertoast.co/scout">Open Kitchen</a>
</main>
<script>if (window.__to) document.getElementById('go').href = window.__to;</script>
</body>
</html>
